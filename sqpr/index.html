<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1330">
<meta name="description" content="Rotina, tarefas, calendário de vídeos, roteiros e pesquisa de GTA VI — SQPR Hunter.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SQPR">
<title>SQPR Hunter — Novembro no modo criador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#FBF0F4; --surface:#FFFFFF; --surface-2:#F6E6F1; --ink:#2A1438; --ink-2:#694A76; --line:#EBD3E5;
  --accent:#BC2B76; --accent-ink:#FFFFFF; --accent-soft:#FADCEA;
  --ok:#2E7444; --ok-soft:#DDEFE1; --hi:#FFF1E2;
  --shadow:0 1px 2px rgba(70,20,80,.06),0 10px 28px -14px rgba(70,20,80,.28);
  --font:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1D1330; --surface:#28193F; --surface-2:#33224F; --ink:#FBEEF5; --ink-2:#CDB4DC; --line:#43305F;
    --accent:#FF88BA; --accent-ink:#2A0F25; --accent-soft:#4A2148;
    --ok:#96DBA5; --ok-soft:#21402C; --hi:#3A2447;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1D1330; --surface:#28193F; --surface-2:#33224F; --ink:#FBEEF5; --ink-2:#CDB4DC; --line:#43305F;
  --accent:#FF88BA; --accent-ink:#2A0F25; --accent-soft:#4A2148;
  --ok:#96DBA5; --ok-soft:#21402C; --hi:#3A2447;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
*{scrollbar-color:var(--line) transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;min-height:clamp(540px,74vh,700px);isolation:isolate;
  --t:#2A1438; --t2:#4E2A5C; --palm-n:#5C2C69; --palm-f:#9C6FB8; --bld:#F1D3EE; --bld-w:#C6A6E4; --road:#7A63A8;
  --s1:#8FB3E6; --s2:#C9A3E3; --s3:#F27FAE; --s4:#F8B27C; --sun:#FFE1B8; --sun-y:58%; --stars:0}
.hero[data-phase="dia"]{--s1:#73C3DD;--s2:#B6D0F2;--s3:#F2C7DD;--s4:#FBD9C0;--sun:#FFF5DE;--sun-y:16%;--palm-n:#6A3B78;--palm-f:#B48DCC}
.hero[data-phase="dourado"]{--s1:#86AEE3;--s2:#C7A2E2;--s3:#F07BA8;--s4:#F8B27C;--sun:#FFDDB0;--sun-y:52%}
.hero[data-phase="anoitecer"]{--t:#FFF3F8;--t2:#FBDDEB;--s1:#4F3F93;--s2:#A26FC4;--s3:#EE73A3;--s4:#F79A75;--sun:#FFC8A6;--sun-y:84%;
  --palm-n:#3A1846;--palm-f:#7C4F9C;--bld:#D8B2E0;--bld-w:#FFD6A8;--road:#5A4688;--stars:.35}
.hero[data-phase="noite"]{--t:#FFF3F8;--t2:#E9CFF0;--s1:#140E2C;--s2:#2D1D58;--s3:#5E2F75;--s4:#A9467A;--sun:#FFB9A0;--sun-y:112%;
  --palm-n:#120A1F;--palm-f:#3B2560;--bld:#4A3270;--bld-w:#FFC98F;--road:#2B1F4A;--stars:1}
.sky{position:absolute;inset:0;z-index:-3;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 38%,var(--s3) 68%,var(--s4) 86%);transition:background 1.2s ease}
.stars{position:absolute;inset:0 0 40% 0;z-index:-3;opacity:var(--stars);transition:opacity 1.2s;
  background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 8%,#fff 60%,transparent),radial-gradient(1.2px 1.2px at 41% 26%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 12%,#fff 60%,transparent),radial-gradient(1.6px 1.6px at 73% 22%,#fff 60%,transparent),radial-gradient(1px 1px at 86% 9%,#fff 60%,transparent),radial-gradient(1.2px 1.2px at 94% 30%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 40%,#fff 60%,transparent),radial-gradient(1px 1px at 50% 40%,#fff 60%,transparent),radial-gradient(1.3px 1.3px at 34% 44%,#fff 60%,transparent)}
.sun{position:absolute;z-index:-2;left:62%;top:var(--sun-y);width:clamp(140px,18vw,250px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 50%,var(--sun) 0 60%,color-mix(in oklab,var(--sun) 40%,transparent) 61%,transparent 72%);transition:top 1.6s cubic-bezier(.16,1,.3,1),background 1.2s}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.scene .bld{fill:var(--bld);transition:fill 1.2s}
.scene .win{fill:var(--bld-w);transition:fill 1.2s}
.scene .road{fill:var(--road);transition:fill 1.2s}
.scene .pn{fill:var(--palm-n);stroke:var(--palm-n);transition:fill 1.2s,stroke 1.2s}
.scene .pf{fill:var(--palm-f);stroke:var(--palm-f);opacity:.75;transition:fill 1.2s,stroke 1.2s}
.hero-in{position:relative;max-width:1180px;margin:0 auto;padding:clamp(1.25rem,4vw,2.5rem) clamp(1rem,4vw,2rem) 0;color:var(--t)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:.9375rem;color:var(--t2);margin:0 0 clamp(1rem,4vh,2.25rem)}
.brand .ed{min-width:4ch}
.brand svg{width:1.4rem;height:1.4rem}
.hero h1{margin:0;font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:-.01em;font-size:clamp(3.6rem,13vw,6rem);text-wrap:balance;max-width:11ch}
.hero h1 .ed{display:block}
.hero h1 .l2{font-weight:600;font-stretch:72%;font-size:.62em;line-height:.95;margin-top:.12em}
.hero-sub{max-width:52ch;margin:1.1rem 0 0;font-size:1.0625rem;line-height:1.5;color:var(--t2);text-wrap:pretty}
.hero-kit{margin:.6rem 0 0;font-size:.875rem;font-weight:600;color:var(--t2)}
.now-card{position:absolute;right:clamp(1rem,4vw,2rem);bottom:clamp(1rem,4vw,1.75rem);width:min(380px,calc(100% - 2rem));background:var(--surface);color:var(--ink);border-radius:var(--r);box-shadow:0 2px 4px rgba(40,10,50,.12),0 24px 48px -18px rgba(40,10,50,.55);padding:1rem 1.1rem 1.05rem}
.now-top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:.8125rem;color:var(--ink-2);font-weight:600}
.now-block{margin:.35rem 0 .1rem;font-size:1.44rem;font-weight:800;font-stretch:80%;line-height:1.1}
.now-time{font-size:.875rem;color:var(--accent);font-weight:700}
.now-do{margin:.4rem 0 0;font-size:.9375rem;color:var(--ink-2);line-height:1.45}
.now-bar{height:4px;border-radius:4px;background:var(--surface-2);margin-top:.75rem;overflow:hidden}
.now-bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}

/* ---------- NAV ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:.25rem;padding:0 clamp(.5rem,3vw,1.5rem);overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:1rem .8rem .9rem;font-weight:600;font-size:.9375rem;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sync{margin-left:auto;display:flex;align-items:center;gap:.45rem;font-size:.8125rem;color:var(--ink-2);white-space:nowrap;padding-left:1rem}
.sync i{width:.5rem;height:.5rem;border-radius:50%;background:var(--ink-2);opacity:.6}
.sync[data-s="synced"] i{background:var(--ok);opacity:1}
.sync[data-s="saving"] i{background:var(--accent);opacity:1}
button.sync{border:0;background:none;font-family:inherit;cursor:pointer}
button.sync:hover span{color:var(--ink);text-decoration:underline}
.acct-form{display:grid;gap:.5rem;max-width:26rem;margin-top:.75rem}
.acct-form input{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);height:2.6rem;padding:0 .7rem;font:inherit;font-size:1rem}
.acct-more{margin-top:1rem}
.acct-more summary{cursor:pointer;color:var(--ink-2);font-weight:600}
.acct-msg{color:var(--warn,#c0392b);margin:.6rem 0 0;font-size:.9375rem}

/* ---------- LAYOUT ---------- */
main{max-width:1180px;margin:0 auto;padding:clamp(1.5rem,4vw,2.5rem) clamp(1rem,4vw,2rem) 3rem}
.grid{display:grid;gap:clamp(1.5rem,3vw,2.25rem);grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.grid > *{min-width:0}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.sec{margin:0 0 2.75rem}
.sec:last-child{margin-bottom:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 .9rem}
h2{margin:0;font-size:1.728rem;font-weight:800;font-stretch:72%;line-height:1.1;letter-spacing:-.005em}
h3{margin:0;font-size:1.2rem;font-weight:700;font-stretch:85%;line-height:1.2}
.lead{margin:-.35rem 0 1rem;color:var(--ink-2);max-width:68ch}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:1.1rem 1.15rem}
.note{margin:1rem 0 0;padding:.85rem 1rem;border-radius:var(--r-sm);background:var(--hi);color:var(--ink);font-size:.9375rem;max-width:80ch}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}

/* ---------- EDITABLE ---------- */
.ed{outline:none;border-radius:6px;min-width:2ch;white-space:pre-wrap;overflow-wrap:anywhere;transition:background .15s,box-shadow .15s;cursor:text}
.ed:hover{background:color-mix(in oklab,var(--accent) 7%,transparent)}
.ed:focus{background:color-mix(in oklab,var(--accent) 10%,transparent);box-shadow:0 0 0 2px color-mix(in oklab,var(--accent) 55%,transparent)}
.ed:empty::before{content:attr(data-ph);color:var(--ink-2);opacity:.7}
.hero .ed:hover{background:rgba(255,255,255,.14)}
.hero .ed:focus{background:rgba(255,255,255,.2);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.hero .ed:empty::before{color:var(--t2)}

/* ---------- LIST ---------- */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:flex-start;gap:.6rem;padding:.45rem .25rem;border-radius:var(--r-sm);position:relative}
.li + .li{border-top:1px solid var(--line)}
.li-t{flex:1;min-width:0;padding:.15rem .3rem}
.li.done .li-t{color:var(--ink-2);text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--ink-2) 60%,transparent)}
.num{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.8125rem;margin-top:.05rem}
.cb{flex:none;width:1.4rem;height:1.4rem;margin-top:.12rem;border-radius:7px;border:2px solid color-mix(in oklab,var(--ink-2) 70%,transparent);background:transparent;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.cb svg{width:.85rem;height:.85rem;stroke-width:3;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.16,1,.3,1)}
.cb[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.cb[aria-checked="true"] svg{opacity:1;transform:none}
.cb:hover{border-color:var(--accent)}
.acts{display:flex;gap:.1rem;opacity:0;transition:opacity .15s;flex:none}
.li:hover .acts,.li:focus-within .acts,.tr:hover .acts,.tr:focus-within .acts,.card:hover .acts,.card:focus-within .acts,.group:hover > .group-h .acts,.group:focus-within > .group-h .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.ib{width:2rem;height:2rem;border-radius:8px;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.del:hover{color:#C0303C}
.ib:disabled{opacity:.3;cursor:default;background:transparent}
.ib svg{width:1rem;height:1rem}
.adder{display:flex;gap:.5rem;margin-top:.6rem}
.adder input{flex:1;min-width:0;border:1px dashed color-mix(in oklab,var(--ink-2) 50%,transparent);background:transparent;border-radius:var(--r-sm);padding:.55rem .75rem;font-size:.9375rem;transition:border-color .15s,background .15s}
.adder input::placeholder{color:var(--ink-2);opacity:.8}
.adder input:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:0;border-radius:var(--r-sm);padding:.55rem .9rem;font-weight:700;font-size:.9375rem;background:var(--accent);color:var(--accent-ink);transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn-ghost{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);border-radius:var(--r-sm);padding:.5rem .8rem;font-weight:600;font-size:.9375rem;background:var(--surface);color:var(--ink);white-space:nowrap;transition:border-color .15s,background .15s}
.btn-ghost:hover{border-color:var(--accent)}
.btn-ghost.warn{color:#B42B3A}
.btn-ghost.warn.armed{background:#B42B3A;color:#fff;border-color:#B42B3A}

/* ---------- TABLE ---------- */
.tbl{display:grid;grid-template-columns:var(--cols);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tr{display:contents}
.th{padding:.7rem .85rem;font-size:.8125rem;font-weight:700;color:var(--ink-2);background:var(--surface-2)}
.td{padding:.6rem .85rem;border-top:1px solid var(--line);min-width:0;font-size:.9375rem}
.td .ed{padding:.1rem .25rem;margin:-.1rem -.25rem;display:block}
.td.strong .ed{font-weight:700}
.td.time{font-weight:700;white-space:nowrap}
.td-act{display:flex;align-items:flex-start;justify-content:flex-end;padding:.4rem .4rem}
.tr.now > .td{background:var(--accent-soft)}
.tr.now > .td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tr.past > .td{color:var(--ink-2)}
.tbl-foot{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
.tbl-foot input{flex:1;min-width:12rem}
.tbl.steps{counter-reset:st}
.tbl.steps .tr:not(.hd) > .td:first-child .ed::before{counter-increment:st;content:counter(st) ". ";color:var(--accent);font-weight:800}
@media (max-width:720px){
  .tbl{display:block;background:transparent;box-shadow:none;overflow:visible}
  .tr{display:block;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:.6rem .5rem .35rem;margin-bottom:.75rem;position:relative}
  .tr.hd{display:none}
  .td{border:0;padding:.3rem .5rem}
  .td::before{content:attr(data-label);display:block;font-size:.75rem;font-weight:700;color:var(--ink-2);margin-bottom:.1rem}
  .td-act{position:absolute;top:.25rem;right:.25rem;padding:0}
  .td-act::before{display:none}
  .tr > .td:first-child{padding-right:6.5rem}
  .tr.now{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
  .tr.now > .td{background:transparent}
  .tr.now > .td:first-child{box-shadow:none}
}

/* ---------- HOJE ---------- */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:.9rem;padding:.55rem 0;position:relative}
.tl li + li{border-top:1px solid var(--line)}
.tl .when{font-weight:700;font-size:.875rem;color:var(--ink-2);padding-top:.1rem}
.tl .what{font-weight:700}
.tl .how{color:var(--ink-2);font-size:.9375rem}
.tl li.past{opacity:.55}
.tl li.now .when{color:var(--accent)}
.tl li.now .what::after{content:"agora";margin-left:.5rem;font-size:.75rem;font-weight:800;color:var(--accent-ink);background:var(--accent);padding:.1rem .45rem;border-radius:99px;vertical-align:.1em}
.kv{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:.4rem 1rem;margin:0}
.kv dt{font-size:.875rem;font-weight:700;color:var(--ink-2);padding-top:.15rem}
.kv dd{margin:0}
.prio .li-t{font-weight:500}

/* ---------- CASA ---------- */
.groups{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));align-items:start}
.group-h{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.4rem}
.group-h h3{flex:1;min-width:0}
.dias{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:.1rem 0 .6rem}
.dia{min-width:2rem;height:2rem;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:.8125rem;font-weight:700;color:var(--ink-2);padding:0 .35rem}
.dia[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.freq{margin-left:.35rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;height:2rem;padding:0 .45rem;font:inherit;font-size:.8125rem;font-weight:600}

/* ---------- CALENDÁRIO ---------- */
.cal-wrap{display:grid;gap:1.5rem;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
@media (max-width:960px){.cal-wrap{grid-template-columns:minmax(0,1fr)}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.35rem}
.cal .wd{font-size:.75rem;font-weight:700;color:var(--ink-2);text-align:center;padding:.2rem 0}
.day{position:relative;min-height:6.2rem;text-align:left;border:0;border-radius:var(--r-sm);padding:.45rem .5rem;background:color-mix(in oklab,var(--pc,transparent) 22%,var(--surface));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.2rem;transition:transform .15s,box-shadow .15s}
.day:hover{transform:translateY(-1px)}
.day .n{font-weight:800;font-stretch:75%;font-size:1.2rem;line-height:1}
.day .pt{display:block;height:4px;border-radius:4px;background:var(--pc,transparent);margin-bottom:.15rem}
.day .tk{font-size:.75rem;line-height:1.25;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.day .tk.done{text-decoration:line-through}
.day .more{font-size:.75rem;font-weight:700;color:var(--accent)}
.day.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.day.today .n::after{content:"hoje";font-size:.6875rem;font-weight:800;font-stretch:100%;margin-left:.35rem;color:var(--accent-ink);background:var(--accent);padding:.05rem .35rem;border-radius:99px;vertical-align:.25em}
.day.blank{background:transparent;box-shadow:none;pointer-events:none}
@media (max-width:560px){.day{min-height:3.6rem;padding:.35rem}.day .tk{display:none}.day .n{font-size:1.05rem}.day.today .n::after{content:"";display:inline-block;width:.45rem;height:.45rem;padding:0;margin-left:.25rem;vertical-align:.2em}.day .dot{display:block;width:.4rem;height:.4rem;border-radius:50%;background:var(--accent)}}
.day .dot{display:none}

function parseHM(s){ const m=/(\d{1,2})\s*[:h.]\s*(\d{2})?/.exec(s||""); if(!m) return null; return (+m[1])*60+(+(m[2]||0)); }
function nowMins(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function blockSpan(r){ let a=parseHM(r.ini), b=parseHM(r.fim); if(a==null||b==null) return null; if(b<=a) b+=1440; return [a,b]; }
function blockState(r){
  const sp=blockSpan(r); if(!sp) return "";
  let m=nowMins(); const [a,b]=sp;
  if(m<a && m+1440<b) m+=1440;
  if(m>=a&&m<b) return "now";
  if(m>=b && m<b+300) return "past";
  return "";
}
function currentBlock(){
  for(const r of S.rotina){ const sp=blockSpan(r); if(!sp) continue; let m=nowMins(); if(m<sp[0]&&m+1440<sp[1]) m+=1440; if(m>=sp[0]&&m<sp[1]) return {r,a:sp[0],b:sp[1],m}; }
  return null;
}
function nextBlock(){
  const m=nowMins(); const list=S.rotina.map(r=>({r,sp:blockSpan(r)})).filter(x=>x.sp).sort((x,y)=>x.sp[0]-y.sp[0]);
  return list.find(x=>x.sp[0]>m)||list[0]||null;
}
function fmtLeft(min){ if(min<60) return `${min} min restantes`; const h=Math.floor(min/60), r=min%60; return `${h} h${r?` ${r} min`:""} restantes`; }

/* ===================== DOM HELPERS ===================== */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k==="style") el.style.cssText=v;
    else if(k.startsWith("on")&&typeof v==="function") el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat(9)){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
}
function splitLines(t){
  return String(t||"").replace(/\r/g,"").split("\n")
    .map(l=>l.replace(/^\s*(?:[-*•–·☐☑✓✔]|\[\s?[xX]?\]|\d{1,2}[.)])\s+/,"").replace(/\s+$/,""))
    .filter(l=>l.trim().length);
}
let pendingFocus=null;
function focusLater(fid,atEnd=true){ pendingFocus={fid,atEnd}; }
function applyFocus(){
  if(!pendingFocus) return; const {fid,atEnd}=pendingFocus; pendingFocus=null;
  const el=document.querySelector(`[data-fid="${CSS.escape(fid)}"]`); if(!el) return;
  el.focus({preventScroll:false});
  if(el.isContentEditable&&atEnd){ const r=document.createRange(); r.selectNodeContents(el); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
}
function insertPlain(t){
  if(!document.execCommand("insertText",false,t)){
    const s=getSelection(); if(!s.rangeCount) return; const r=s.getRangeAt(0); r.deleteContents(); r.insertNode(document.createTextNode(t)); r.collapse(false);
  }
}
/* campo editável ligado a obj[key] */
function ed(obj,key,o={}){
  const el=h(o.tag||"div",{class:"ed "+(o.cls||""),contenteditable:"true",spellcheck:"true","data-ph":o.ph||"",role:"textbox","aria-label":o.label||o.ph||key,"aria-multiline":o.multi?"true":null});
  el.textContent=obj[key]??"";
  if(o.fid) el.dataset.fid=o.fid;
  el.addEventListener("input",()=>{
    let v=el.innerText.replace(/\u00a0/g," ");
    if(!o.multi) v=v.replace(/\n+/g," ");
    v=v.replace(/\n$/,"");
    if(el.textContent===""&&el.childNodes.length) el.innerHTML="";
    obj[key]=v; touch(); if(o.onInput) o.onInput(v);
  });
  el.addEventListener("paste",e=>{
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData("text/plain")||"";
    if(o.onPasteLines&&/[\n\t]/.test(t.trim())){ o.onPasteLines(t); return; }
    insertPlain(o.multi?t:t.replace(/\s*[\r\n]+\s*/g," "));
  });
  el.addEventListener("drop",e=>e.preventDefault());
  el.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey&&!o.multi){ e.preventDefault(); if(o.onEnter) o.onEnter(); else el.blur(); }
    else if(e.key==="Backspace"&&o.onBackspaceEmpty&&el.textContent===""){ e.preventDefault(); o.onBackspaceEmpty(); }
    else if(e.key==="Escape") el.blur();
  });
  el.addEventListener("focusout",()=>setTimeout(applyRemoteIfIdle,50));
  return el;
}

let tt=null;

  const el=document.getElementById("toast"); el.replaceChildren(h("span",{text:msg}));
  if(actLabel) el.append(h("button",{type:"button",onclick:()=>{ el.classList.remove("on"); act(); }},actLabel));
  el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),actLabel?6000:2600);
}

function checkbox(on,toggle,label){

function adder(onAdd,ph,fid,compact){
  const inp=h("input",{type:"text",placeholder:ph||"Novo item — ou cole várias linhas de uma vez","aria-label":ph||"Novo item","data-fid":fid||null});
  const go=()=>{ const ls=splitLines(inp.value); if(!ls.length){ inp.focus(); return; } if(fid) focusLater(fid,false); onAdd(ls); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } });
  inp.addEventListener("paste",e=>{ const t=e.clipboardData.getData("text/plain")||""; if(/[\n]/.test(t.trim())){ e.preventDefault(); const ls=splitLines(t); if(fid) focusLater(fid,false); onAdd(ls); toast(`${ls.length} itens adicionados`); } });
  return h("div",{class:"adder"},inp,compact?h("button",{type:"button",class:"btn-ghost ico","aria-label":"Adicionar",title:"Adicionar",onclick:go},ic("plus")):h("button",{type:"button",class:"btn-ghost",onclick:go},ic("plus"),"Adicionar"));
}
/* lista editável. o: {isDone(it), setDone(it,v), numbered, ph, adderPh, what, cls} */
function List(arr,o={}){
  const ul=h(o.numbered?"ol":"ul",{class:"list "+(o.cls||"")});
  arr.forEach((x,i)=>{
    const done=o.isDone?o.isDone(x):false;
    const li=h("li",{class:"li"+(done?" done":"")});
    if(o.isDone) li.append(checkbox(done,v=>{ o.setDone(x,v); commit(); },x.t));
    if(o.numbered) li.append(h("span",{class:"num","aria-hidden":"true",text:String(i+1)}));
    li.append(ed(x,"t",{cls:"li-t",ph:o.ph||"Escreva…",fid:x.id,
      onEnter:()=>{ const n=it(""); arr.splice(i+1,0,n); focusLater(n.id); commit(); },
      onBackspaceEmpty:()=>{ const prev=arr[i-1]; arr.splice(i,1); if(prev) focusLater(prev.id); commit(); },
      onPasteLines:t=>{ const ls=splitLines(t); if(!ls.length) return; if(!x.t.trim()) x.t=ls.shift(); const add=ls.map(it); arr.splice(i+1,0,...add); focusLater((add.at(-1)||x).id); commit(); toast(`${ls.length+1} itens colados`); }
    }), rowActs(arr,i,o.what||"Item"));
    ul.append(li);
  });
  const fid="add-"+(o.key||Math.random());
  return h("div",{class:"list-wrap"},ul,adder(ls=>{ arr.push(...ls.map(it)); commit(); },o.adderPh,fid));
}
/* tabela editável. cols: [{k,label,w,ph,cls,multi,render}] */
function Table(rows,cols,o={}){
  const t=h("div",{class:"tbl "+(o.cls||""),role:"table",style:`--cols:${cols.map(c=>c.w||"minmax(0,1fr)").join(" ")} 6.4rem`});
  t.append(h("div",{class:"tr hd",role:"row"},cols.map(c=>h("div",{class:"th",role:"columnheader",text:c.label})),h("div",{class:"th",role:"columnheader"},h("span",{class:"sr",text:"Ações"}))));
  const blank=()=>{ const r={id:uid()}; cols.forEach(c=>r[c.k]=""); if(o.extra) Object.assign(r,o.extra()); return r; };
  const fromLine=(line,start=0)=>{ const r=blank(); line.split("\t").forEach((v,j)=>{ const c=cols[start+j]; if(c) r[c.k]=v.trim(); else { const last=cols[cols.length-1]; r[last.k]=(r[last.k]?r[last.k]+" ":"")+v.trim(); } }); return r; };
  rows.forEach((r,i)=>{
    const row=h("div",{class:"tr "+(o.rowClass?o.rowClass(r,i):""),role:"row","data-rid":r.id});
    cols.forEach((c,ci)=>{
      const cell=h("div",{class:"td "+(c.cls||""),role:"cell","data-label":c.label});
      if(c.render) cell.append(c.render(r,i));
      else cell.append(ed(r,c.k,{ph:c.ph||c.label,multi:!!c.multi,label:c.label,fid:ci===0?r.id:null,
        onPasteLines:txt=>{
          const lines=String(txt).replace(/\r/g,"").split("\n").filter(l=>l.trim());
          const first=lines.shift().split("\t");
          first.forEach((v,j)=>{ const cc=cols[ci+j]; if(cc&&!cc.render) r[cc.k]=v.trim(); });
          const add=lines.map(l=>fromLine(l,l.includes("\t")?0:ci));
          rows.splice(i+1,0,...add); commit(); toast(`${add.length+1} linhas coladas`);
        }}));
      row.append(cell);
    });
    row.append(h("div",{class:"td td-act",role:"cell"},rowActs(rows,i,o.what||"Linha")));
    t.append(row);
  });
  const fid="tadd-"+(o.key||"x");
  const inp=h("input",{type:"text",class:"adder-in","data-fid":fid,placeholder:o.adderPh||"Nova linha — cole linhas do Excel/Sheets (colunas separadas por tab)","aria-label":"Nova linha"});

/* cena: prédios + palmeiras (gerado) */
function rng(seed){ return ()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }
function buildScene(){
  const svg=document.getElementById("scene"); const R=rng(20261101); const NS="http://www.w3.org/2000/svg";
  const el=(n,a)=>{ const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); return e; };
  const g=el("g",{});
  const horizon=520;
  // prédios art déco
  const bld=el("g",{class:"bld-g"}); let x=640;
  while(x<1600){
    const w=70+R()*110, hgt=90+R()*190;
    if(R()<.25){ x+=20+R()*40; continue; }
    bld.append(el("rect",{class:"bld",x:x.toFixed(1),y:(horizon-hgt).toFixed(1),width:w.toFixed(1),height:(hgt+4).toFixed(1),rx:"2"}));
    if(R()<.6){ const sw=w*.6; bld.append(el("rect",{class:"bld",x:(x+(w-sw)/2).toFixed(1),y:(horizon-hgt-18).toFixed(1),width:sw.toFixed(1),height:"20"})); }
    if(R()<.35){ const sw=w*.28; bld.append(el("rect",{class:"bld",x:(x+(w-sw)/2).toFixed(1),y:(horizon-hgt-34).toFixed(1),width:sw.toFixed(1),height:"18"})); }
    const cols=Math.max(2,Math.floor(w/26)), rowsN=Math.floor((hgt-24)/30);
    for(let r=0;r<rowsN;r++) for(let c=0;c<cols;c++){ if(R()<.25) continue;
      bld.append(el("rect",{class:"win",x:(x+10+c*((w-20)/cols)).toFixed(1),y:(horizon-hgt+14+r*30).toFixed(1),width:((w-20)/cols-8).toFixed(1),height:"12",rx:"1.5",opacity:(.45+R()*.45).toFixed(2)})); }
    x+=w+6+R()*14;
  }
  bld.setAttribute("opacity",".82");
  g.append(bld);
  g.append(el("rect",{class:"road",x:"-10",y:String(horizon),width:"1620",height:"90"}));
  // palmeiras
  function palm(px,base,hgt,lean,sc,cls){
    const pg=el("g",{class:cls});
    const tx=px+lean, ty=base-hgt, cx=px+lean*.15, cy=base-hgt*.55;
    const P=t=>[(1-t)*(1-t)*px+2*(1-t)*t*cx+t*t*tx,(1-t)*(1-t)*base+2*(1-t)*t*cy+t*t*ty];
    const L=[],Rr=[];
    for(let i=0;i<=16;i++){ const t=i/16, [x1,y1]=P(t), [x2,y2]=P(Math.min(1,t+.01)); let nx=-(y2-y1), ny=x2-x1; const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l; const w=(9-4.5*t)*sc; L.push([x1+nx*w,y1+ny*w]); Rr.push([x1-nx*w,y1-ny*w]); }
    pg.append(el("path",{d:"M"+L.map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L")+"L"+Rr.reverse().map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L")+"Z",stroke:"none"}));
    let leaves="";
    const angs=[-172,-148,-122,-96,-70,-42,-14,8];
    angs.forEach(a0=>{
      const a=(a0+(R()*14-7))*Math.PI/180; const Ln=hgt*(.36+R()*.12);
      const dx=Math.cos(a), dy=Math.sin(a);
      const p0=[tx,ty], p1=[tx+dx*Ln*.55,ty+dy*Ln*.55-Ln*.12], p2=[tx+dx*Ln,ty+dy*Ln+Ln*(.32+.25*Math.abs(dx))];
      const Q=t=>[(1-t)*(1-t)*p0[0]+2*(1-t)*t*p1[0]+t*t*p2[0],(1-t)*(1-t)*p0[1]+2*(1-t)*t*p1[1]+t*t*p2[1]];
      let spine="M"+p0.map(v=>v.toFixed(1)).join(",");
      const N=22;
      for(let i=1;i<=N;i++){ const t=i/N, [qx,qy]=Q(t); spine+="L"+qx.toFixed(1)+","+qy.toFixed(1);
        const [ux,uy]=Q(Math.min(1,t+.02)); let nx=-(uy-qy), ny=ux-qx; const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l;
        const w=Ln*.2*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.05)),.6);
        for(const s of [1,-1]){ let lx=nx*s*.55, ly=ny*s*.55+.85; const ll=Math.hypot(lx,ly); lx/=ll; ly/=ll;
          leaves+=`M${qx.toFixed(1)},${qy.toFixed(1)}L${(qx+lx*w).toFixed(1)},${(qy+ly*w).toFixed(1)}`; }
      }
      leaves+=spine;
    });
    pg.append(el("path",{d:leaves,fill:"none","stroke-width":(2.6*sc).toFixed(1),"stroke-linecap":"round"}));
    pg.append(el("circle",{cx:tx.toFixed(1),cy:ty.toFixed(1),r:(9*sc).toFixed(1),stroke:"none"}));
    return pg;
  }
  // distantes
  [[835,528,230,-20,.55],[1120,528,250,-18,.58],[1250,528,210,26,.55],[1420,528,260,22,.6],[1585,528,220,-22,.55]].forEach(a=>g.append(palm(...a,"pf")));
  // próximas
  [[930,610,430,-30,.95],[1060,610,500,36,1.1],[1350,610,470,-46,1.05],[1560,610,420,-30,.95]].forEach(a=>g.append(palm(...a,"pn")));
  svg.append(g);
}

    let atualizando=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(atualizando) location.reload(); });
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      const avisar=w=>toast("Nova versão do app disponível","Atualizar",()=>{ atualizando=true; persistLocal(); w.postMessage("skip"); });
      if(reg.waiting&&navigator.serviceWorker.controller) avisar(reg.waiting);
      reg.addEventListener("updatefound",()=>{ const w=reg.installing; if(!w) return; w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) avisar(w); }); });
      setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
    }).catch(()=>{});
  });
}
</script>
</body>
